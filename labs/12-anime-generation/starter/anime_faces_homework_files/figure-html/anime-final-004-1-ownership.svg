<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-label="Provided data paths feed a student-designed experiment, then measured outputs feed the report"><rect width="1200" height="510" fill="#f5f1e8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526575" stroke-width="1.5"/></marker></defs><g font-family="sans-serif" fill="#17212b"><text x="35" y="40" font-size="25" font-weight="bold">Provided infrastructure</text><text x="458" y="40" font-size="25" font-weight="bold">Your scientific decisions</text><text x="878" y="40" font-size="25" font-weight="bold">Your evidence</text><g fill="#e0ebf0" stroke="#9ebdd1"><rect x="30" y="70" width="290" height="100" rx="10"/><rect x="30" y="215" width="290" height="120" rx="10"/></g><g text-anchor="middle" font-size="21"><text x="175" y="108">Manifest: paths + hashes</text><text x="175" y="145">train / validation / test</text><text x="175" y="256">FaceDataset stores paths</text><text x="175" y="290">Loader decodes RGB tensors</text></g><g fill="#f6e1d9" stroke="#d7aea0"><rect x="430" y="70" width="320" height="100" rx="10"/><rect x="430" y="215" width="320" height="120" rx="10"/></g><g text-anchor="middle" font-size="21"><text x="590" y="108">Model + objective</text><text x="590" y="145">Architecture you justify</text><text x="590" y="255">Training + one change</text><text x="590" y="290">Separate model parameters</text></g><rect x="865" y="145" width="305" height="190" rx="10" fill="#e2efe8" stroke="#a0c4ac"/><g text-anchor="middle" font-size="21"><text x="1017" y="190">Samples + checkpoints</text><text x="1017" y="235">Metrics + limitations</text><text x="1017" y="280">Self-contained report</text></g><g fill="none" stroke="#526575" stroke-width="3" marker-end="url(#a)"><path d="M175 178V203"/><path d="M332 275H418"/><path d="M590 178V203"/><path d="M762 275H853"/></g><text x="35" y="405" font-size="21">Manifest entries reference files; they are not copied image tensors.</text><text x="35" y="445" font-size="21">Only the training split enters optimizer updates. Validation selects; test evaluates once.</text></g></svg>