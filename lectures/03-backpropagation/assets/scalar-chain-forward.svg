<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Forward computation of a five-operation scalar expression</title><desc id="desc">A two-row graph evaluates x equals 1 through square, plus one, cube, minus two, and square operations to produce loss 36.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2878c8"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f2a37" flood-opacity=".12"/></filter><style>.e{fill:none;stroke:#2878c8;stroke-width:4;marker-end:url(#a)}.v{fill:#eaf3fb;stroke:#2878c8;stroke-width:4}.o{fill:#fffdf7;stroke:#17212b;stroke-width:4;filter:url(#s)}.l{fill:#ef5b45;stroke:#bd3e2d;stroke-width:4;filter:url(#s)}.id{fill:#17212b;font:italic 700 28px Georgia,serif;text-anchor:middle}.sub{fill:#657079;font:19px Arial,sans-serif;text-anchor:middle}.leg{fill:#657079;font:19px Arial,sans-serif;text-anchor:start}.sym{fill:#17212b;font:700 34px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.white{fill:#fff;font:italic 700 28px Georgia,serif;text-anchor:middle}.stage{fill:#657079;font:700 17px "Courier New",monospace;letter-spacing:1px}</style></defs>
<text class="stage" x="42" y="35">FORWARD · COMPUTE AND REMEMBER</text>
<path class="e" d="M155 145H250M360 145H455M565 145H660M770 145H865M975 145H1070M1125 200V305M1070 360H975M865 360H770M660 360H565M455 360H365"/>
<circle class="v" cx="100" cy="145" r="55"/><text class="id" x="100" y="140">x = 1</text><text class="sub" x="100" y="170">input</text>
<rect class="o" x="250" y="90" width="110" height="110" rx="20"/><text class="sym" x="305" y="140">(·)²</text><text class="sub" x="305" y="178">a = x²</text>
<circle class="v" cx="510" cy="145" r="55"/><text class="id" x="510" y="140">a = 1</text><text class="sub" x="510" y="170">stored</text>
<rect class="o" x="660" y="90" width="110" height="110" rx="20"/><text class="sym" x="715" y="140">+1</text><text class="sub" x="715" y="178">b = a + 1</text>
<circle class="v" cx="920" cy="145" r="55"/><text class="id" x="920" y="140">b = 2</text><text class="sub" x="920" y="170">stored</text>
<rect class="o" x="1070" y="90" width="110" height="110" rx="20"/><text class="sym" x="1125" y="140">(·)³</text><text class="sub" x="1125" y="178">c = b³</text>
<circle class="v" cx="1125" cy="360" r="55"/><text class="id" x="1125" y="355">c = 8</text><text class="sub" x="1125" y="385">stored</text>
<rect class="o" x="865" y="305" width="110" height="110" rx="20"/><text class="sym" x="920" y="355">−2</text><text class="sub" x="920" y="393">d = c − 2</text>
<circle class="v" cx="715" cy="360" r="55"/><text class="id" x="715" y="355">d = 6</text><text class="sub" x="715" y="385">stored</text>
<rect class="o" x="455" y="305" width="110" height="110" rx="20"/><text class="sym" x="510" y="355">(·)²</text><text class="sub" x="510" y="393">𝓛 = d²</text>
<circle class="l" cx="310" cy="360" r="55"/><text class="white" x="310" y="356">𝓛 = 36</text><text class="sub" x="310" y="387" fill="#fff">loss</text>
<g transform="translate(45 500)"><circle class="v" cx="20" cy="0" r="17"/><text class="leg" x="50" y="7">value</text><rect class="o" x="155" y="-20" width="40" height="40" rx="8"/><text class="leg" x="215" y="7">operation</text><circle class="l" cx="390" cy="0" r="17"/><text class="leg" x="420" y="7">loss</text></g>
</svg>
