<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Local derivatives for five scalar operations</title><desc id="desc">The two-row computation graph shows one coral derivative badge beside each operation: 2, 1, 12, 1, and 12.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2878c8"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f2a37" flood-opacity=".12"/></filter><style>.e{fill:none;stroke:#2878c8;stroke-width:4;marker-end:url(#a)}.v{fill:#eaf3fb;stroke:#2878c8;stroke-width:4}.o{fill:#fffdf7;stroke:#17212b;stroke-width:4;filter:url(#s)}.l{fill:#ef5b45;stroke:#bd3e2d;stroke-width:4;filter:url(#s)}.badge{fill:#fffdf7;stroke:#ef5b45;stroke-width:3}.id{fill:#17212b;font:italic 700 27px Georgia,serif;text-anchor:middle}.sub{fill:#657079;font:18px Arial,sans-serif;text-anchor:middle}.sym{fill:#17212b;font:700 33px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.white{fill:#fff;font:italic 700 27px Georgia,serif;text-anchor:middle}.der{fill:#ef5b45;font:700 20px Arial,sans-serif;text-anchor:middle}.stage{fill:#657079;font:700 17px "Courier New",monospace;letter-spacing:1px}</style></defs>
<text class="stage" x="42" y="30">LOCAL VIEW · DIFFERENTIATE ONE OPERATION</text>
<path class="e" d="M155 135H250M360 135H455M565 135H660M770 135H865M975 135H1070M1125 190V300M1070 355H975M865 355H770M660 355H565M455 355H365"/>
<circle class="v" cx="100" cy="135" r="55"/><text class="id" x="100" y="143">x = 1</text>
<rect class="o" x="250" y="80" width="110" height="110" rx="20"/><text class="sym" x="305" y="130">(·)²</text><text class="sub" x="305" y="168">a = x²</text><rect class="badge" x="225" y="212" width="160" height="48" rx="14"/><text class="der" x="305" y="243">da/dx = 2</text>
<circle class="v" cx="510" cy="135" r="55"/><text class="id" x="510" y="143">a = 1</text>
<rect class="o" x="660" y="80" width="110" height="110" rx="20"/><text class="sym" x="715" y="130">+1</text><text class="sub" x="715" y="168">b = a + 1</text><rect class="badge" x="635" y="212" width="160" height="48" rx="14"/><text class="der" x="715" y="243">db/da = 1</text>
<circle class="v" cx="920" cy="135" r="55"/><text class="id" x="920" y="143">b = 2</text>
<rect class="o" x="1070" y="80" width="110" height="110" rx="20"/><text class="sym" x="1125" y="130">(·)³</text><text class="sub" x="1125" y="168">c = b³</text><rect class="badge" x="1030" y="212" width="190" height="48" rx="14"/><text class="der" x="1125" y="243">dc/db = 12</text>
<circle class="v" cx="1125" cy="355" r="55"/><text class="id" x="1125" y="363">c = 8</text>
<rect class="o" x="865" y="300" width="110" height="110" rx="20"/><text class="sym" x="920" y="350">−2</text><text class="sub" x="920" y="388">d = c − 2</text><rect class="badge" x="840" y="438" width="160" height="48" rx="14"/><text class="der" x="920" y="469">dd/dc = 1</text>
<circle class="v" cx="715" cy="355" r="55"/><text class="id" x="715" y="363">d = 6</text>
<rect class="o" x="455" y="300" width="110" height="110" rx="20"/><text class="sym" x="510" y="350">(·)²</text><text class="sub" x="510" y="388">𝓛 = d²</text><rect class="badge" x="420" y="438" width="180" height="48" rx="14"/><text class="der" x="510" y="469">d𝓛/dd = 12</text>
<circle class="l" cx="310" cy="355" r="55"/><text class="white" x="310" y="363">𝓛 = 36</text>
</svg>
