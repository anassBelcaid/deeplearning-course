<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Inception block with four parallel branches</title><desc id="desc">One input splits into four parallel paths: one by one convolution; one by one then three by three convolution; one by one then five by five convolution; and max pooling then one by one convolution. Outputs are concatenated along channels.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#526573"/></marker><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17212b" flood-opacity=".14"/></filter><style>.plate{fill:#f7fafc;stroke:#2878c8;stroke-width:2.4;stroke-dasharray:9 7;rx:18}.lane{fill:#fff;stroke:#c8d6df;stroke-width:1.5;rx:13}.conv{fill:#b9dcf7;stroke:#17212b;stroke-width:1.4;rx:7;filter:url(#s)}.reduce{fill:#dff2e8;stroke:#25734d;stroke-width:1.4;rx:7}.pool{fill:#f4b267;stroke:#17212b;stroke-width:1.4;rx:7}.merge{fill:#d8c8ec;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.4;rx:7}.label{fill:#17212b;font:600 15px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.title{font:700 13px Arial,sans-serif;text-anchor:middle}.flow{fill:none;stroke:#526573;stroke-width:2.2;marker-end:url(#a)}.note{fill:#526573;font:600 12px Arial,sans-serif;text-anchor:middle}</style></defs>
<rect class="plate" x="25" y="55" width="1150" height="410"/><text class="note" x="600" y="82">all branches preserve H × W</text>
<rect class="lane" x="55" y="105" width="245" height="300"/><text class="title" x="177.5" y="132" fill="#2878c8">BRANCH 1 · DIRECT</text><rect class="conv" x="82" y="235" width="191" height="55"/><text class="label" x="177.5" y="262.5">1 × 1 Conv · c₁</text>
<rect class="lane" x="325" y="105" width="245" height="300"/><text class="title" x="447.5" y="132" fill="#25734d">BRANCH 2 · MEDIUM</text><rect class="reduce" x="352" y="315" width="191" height="48"/><text class="label" x="447.5" y="339">1 × 1 · c₂₁</text><rect class="conv" x="352" y="190" width="191" height="55"/><text class="label" x="447.5" y="217.5">3 × 3 · c₂₂</text><path class="flow" d="M447.5 310V250"/>
<rect class="lane" x="595" y="105" width="245" height="300"/><text class="title" x="717.5" y="132" fill="#25734d">BRANCH 3 · WIDE</text><rect class="reduce" x="622" y="315" width="191" height="48"/><text class="label" x="717.5" y="339">1 × 1 · c₃₁</text><rect class="conv" x="622" y="190" width="191" height="55"/><text class="label" x="717.5" y="217.5">5 × 5 · c₃₂</text><path class="flow" d="M717.5 310V250"/>
<rect class="lane" x="865" y="105" width="280" height="300"/><text class="title" x="1005" y="132" fill="#d26d22">BRANCH 4 · CONTEXT</text><rect class="pool" x="895" y="315" width="220" height="48"/><text class="label" x="1005" y="339">MaxPool 3 × 3</text><rect class="reduce" x="895" y="190" width="220" height="55"/><text class="label" x="1005" y="217.5">1 × 1 Conv · c₄</text><path class="flow" d="M1005 310V250"/>
<rect class="io" x="420" y="480" width="360" height="42"/><text class="label" x="600" y="501">input · H × W × C</text><path class="flow" d="M600 476V444H177.5V410"/><path class="flow" d="M600 444H447.5V370"/><path class="flow" d="M600 444H717.5V370"/><path class="flow" d="M600 444H1005V370"/>
<rect class="merge" x="375" y="5" width="450" height="42"/><text class="label" x="600" y="26">concatenate channels · c₁ + c₂₂ + c₃₂ + c₄</text><path class="flow" d="M177.5 230V95H600V52"/><path class="flow" d="M447.5 185V95"/><path class="flow" d="M717.5 185V95"/><path class="flow" d="M1005 185V95"/>
</svg>
