<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">Full Network in Network architecture</title><desc id="desc">Four NiN blocks are grouped in labeled plates. The first three are followed by max pooling. The final block produces one map per class, followed by global average pooling and flattening.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#17212b" flood-opacity=".13"/></filter><style>.plate{fill:#edf6ff;stroke:#2878c8;stroke-width:2;stroke-dasharray:8 6;rx:14}.last{fill:#eef8f2;stroke:#25734d}.conv{fill:#b9dcf7;stroke:#17212b;stroke-width:1.2;rx:5;filter:url(#s)}.mix{fill:#dff2e8;stroke:#25734d;stroke-width:1.2;rx:5}.pool{fill:#f4b267;stroke:#17212b;stroke-width:1.2;rx:5}.gap{fill:#f4b267;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.2;rx:5}.fc{fill:#d8c8ec;stroke:#17212b;stroke-width:1.2;rx:5}.label{fill:#17212b;font:600 13px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.title{fill:#1f5f96;font:700 12px Arial,sans-serif}.lasttitle{fill:#25734d}.note{fill:#526573;font:600 12px Arial,sans-serif;text-anchor:middle}</style></defs>
  <rect class="fc" x="470" y="18" width="240" height="34"/><text class="label" x="590" y="35">K logits</text>
  <rect class="gap" x="410" y="69" width="360" height="42"/><text class="label" x="590" y="90">Global average pool · 1 × 1</text>
  <rect class="plate last" x="330" y="127" width="520" height="91"/><text class="title lasttitle" x="350" y="150">NiN BLOCK 4 · CLASS MAPS</text><rect class="conv" x="370" y="163" width="210" height="34"/><text class="label" x="475" y="180">conv3 → K</text><rect class="mix" x="594" y="163" width="216" height="34"/><text class="label" x="702" y="180">1×1 → 1×1 → K</text>
  <rect class="plate" x="285" y="234" width="610" height="91"/><text class="title" x="305" y="257">NiN BLOCK 3</text><rect class="conv" x="325" y="270" width="240" height="34"/><text class="label" x="445" y="287">conv3 → 384</text><rect class="mix" x="579" y="270" width="276" height="34"/><text class="label" x="717" y="287">1×1 → 1×1 → 384</text><rect class="pool" x="915" y="258" width="180" height="42"/><text class="label" x="1005" y="279">pool3 · s2</text>
  <rect class="plate" x="240" y="341" width="700" height="91"/><text class="title" x="260" y="364">NiN BLOCK 2</text><rect class="conv" x="280" y="377" width="270" height="34"/><text class="label" x="415" y="394">conv5 → 256</text><rect class="mix" x="564" y="377" width="336" height="34"/><text class="label" x="732" y="394">1×1 → 1×1 → 256</text><rect class="pool" x="960" y="365" width="180" height="42"/><text class="label" x="1050" y="386">pool3 · s2</text>
  <rect class="plate" x="195" y="448" width="790" height="91"/><text class="title" x="215" y="471">NiN BLOCK 1</text><rect class="conv" x="235" y="484" width="300" height="34"/><text class="label" x="385" y="501">conv11 · s4 → 96</text><rect class="mix" x="549" y="484" width="396" height="34"/><text class="label" x="747" y="501">1×1 → 1×1 → 96</text><rect class="pool" x="1005" y="472" width="150" height="42"/><text class="label" x="1080" y="493">pool3 · s2</text>
  <rect class="io" x="120" y="556" width="940" height="34"/><text class="label" x="590" y="573">image · 224 × 224 × 3</text>
  <text class="note" x="1050" y="145">no dense classifier</text>
</svg>
