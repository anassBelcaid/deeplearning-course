<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">How NiN addresses two VGG limitations</title>
  <desc id="desc">The upper path shows VGG flattening spatial feature maps into large fully connected layers. The lower path shows NiN mixing channels locally with one by one convolutions, producing class maps, and replacing the dense head with global average pooling.</desc>
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17212b" flood-opacity=".14"/></filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#526573"/></marker>
    <style>.plate{fill:#fff7eb;stroke:#d26d22;stroke-width:2.3;stroke-dasharray:8 6;rx:17}.ninplate{fill:#edf6ff;stroke:#2878c8;stroke-width:2.3;stroke-dasharray:8 6;rx:17}.map{fill:#b9dcf7;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.mix{fill:#dff2e8;stroke:#25734d;stroke-width:1.5;rx:7;filter:url(#s)}.fc{fill:#d8c8ec;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.gap{fill:#f4b267;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.label{fill:#17212b;font:600 16px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.head{fill:#17212b;font:700 18px Arial,sans-serif}.tag{font:700 12px Arial,sans-serif}.flow{stroke:#526573;stroke-width:2.5;marker-end:url(#a)}.note{fill:#526573;font:600 13px Arial,sans-serif;text-anchor:middle}</style>
  </defs>
  <text class="head" x="36" y="32">VGG HEAD</text><text class="tag" x="1130" y="32" fill="#a75217" text-anchor="end">PARAMETER BOTTLENECK</text>
  <rect class="plate" x="25" y="50" width="1150" height="170"/>
  <rect class="map" x="75" y="105" width="220" height="60"/><text class="label" x="185" y="135">7 × 7 × 512 features</text><line class="flow" x1="310" y1="135" x2="390" y2="135"/>
  <rect class="fc" x="405" y="105" width="210" height="60"/><text class="label" x="510" y="135">Flatten · 25,088</text><line class="flow" x1="630" y1="135" x2="710" y2="135"/>
  <rect class="fc" x="725" y="105" width="165" height="60"/><text class="label" x="807.5" y="135">FC 4096</text><line class="flow" x1="905" y1="135" x2="955" y2="135"/>
  <rect class="fc" x="970" y="105" width="145" height="60"/><text class="label" x="1042.5" y="135">FC 4096</text>
  <text class="note" x="600" y="198">spatial layout disappears · most parameters move into the classifier</text>

  <text class="head" x="36" y="273">NiN HEAD</text><text class="tag" x="1130" y="273" fill="#1f5f96" text-anchor="end">LOCAL MIXING + PARAMETER-LIGHT READOUT</text>
  <rect class="ninplate" x="25" y="291" width="1150" height="190"/>
  <rect class="map" x="64" y="348" width="205" height="60"/><text class="label" x="166.5" y="378">H × W × C features</text><line class="flow" x1="284" y1="378" x2="354" y2="378"/>
  <rect class="mix" x="369" y="348" width="170" height="60"/><text class="label" x="454" y="378">1 × 1 Conv</text><line class="flow" x1="554" y1="378" x2="624" y2="378"/>
  <rect class="mix" x="639" y="348" width="205" height="60"/><text class="label" x="741.5" y="378">K class maps</text><line class="flow" x1="859" y1="378" x2="929" y2="378"/>
  <rect class="gap" x="944" y="348" width="170" height="60"/><text class="label" x="1029" y="378">Global avg pool</text>
  <text class="note" x="600" y="450">mix channels at every location · average each class map into one logit</text>
</svg>
