    <path d="M60 0c24 0 43 20 43 44 0 14-7 27-18 35l27 91 24 100H86L64 187 43 270H-5l27-102 19-90C27 71 18 56 18 40 18 18 37 0 60 0Z" fill="#7655ad" opacity=".9"/>
