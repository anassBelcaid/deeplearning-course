<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">One convolution filter spans all input channels</title><desc id="d">Red, green, and blue input patches are multiplied by matching filter slices, summed with a bias, and produce one value in one output feature map.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker></defs><rect width="1200" height="500" rx="18" fill="#f4f0e8"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="210" y="48" font-size="23" font-weight="750" fill="#213744">one RGB input patch</text><text x="570" y="48" font-size="23" font-weight="750" fill="#213744">one filter: 3 slices</text><text x="1000" y="48" font-size="23" font-weight="750" fill="#213744">one output channel</text>
<g transform="translate(80 95)"><rect x="50" y="0" width="190" height="190" fill="#f7d8d3" stroke="#d6503d" stroke-width="6"/><rect x="25" y="35" width="190" height="190" fill="#dff0df" stroke="#38865a" stroke-width="6"/><rect y="70" width="190" height="190" fill="#dcecff" stroke="#2878c8" stroke-width="6"/><text x="95" y="300" font-size="20" fill="#526573">3 × K × K</text></g><text x="395" y="220" font-size="48" fill="#ef6b52">⊙</text>
<g transform="translate(460 95)"><rect x="50" y="0" width="190" height="190" fill="#fff" stroke="#d6503d" stroke-width="6"/><path d="M80 40L205 160" stroke="#d6503d" stroke-width="12"/><rect x="25" y="35" width="190" height="190" fill="#fff" stroke="#38865a" stroke-width="6"/><path d="M55 195L180 70" stroke="#38865a" stroke-width="12"/><rect y="70" width="190" height="190" fill="#fff" stroke="#2878c8" stroke-width="6"/><path d="M25 205H165" stroke="#2878c8" stroke-width="12"/><text x="95" y="300" font-size="20" fill="#526573">learned together</text></g><path d="M730 215H850" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/><text x="790" y="185" font-size="19" fill="#526573">sum channels + bias</text><g transform="translate(890 110)"><rect width="220" height="220" rx="14" fill="#e5f4f3" stroke="#008e9b" stroke-width="7"/><circle cx="110" cy="110" r="45" fill="#008e9b"/><text x="110" y="280" font-size="20" fill="#526573">repeat spatially</text></g></g></svg>
