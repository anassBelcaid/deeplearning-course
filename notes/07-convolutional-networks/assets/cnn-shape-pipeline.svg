<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 430" role="img" aria-labelledby="title desc">
  <title id="title">Tensor shapes through a small convolutional classifier</title><desc id="desc">A batch of RGB images flows through two convolution, activation, and pooling blocks, then flattening and a linear classifier.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker></defs>
  <rect width="1350" height="430" rx="18" fill="#f4f0e8"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(45 95)"><rect width="210" height="220" rx="12" fill="#fff" stroke="#526573" stroke-width="6"/><text x="105" y="45" font-size="17" font-weight="800" fill="#526573">INPUT</text><text x="105" y="110" font-size="23" font-weight="750" fill="#213744">N × 3 × 32 × 32</text><text x="105" y="160" font-size="18" fill="#526573">RGB images</text></g>
    <path d="M275 205H350" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(370 70)"><rect width="270" height="270" rx="12" fill="#fff" stroke="#2878c8" stroke-width="6"/><text x="135" y="42" font-size="17" font-weight="800" fill="#2878c8">BLOCK 1</text><g font-size="18" font-weight="700"><rect x="25" y="70" width="220" height="38" rx="5" fill="#e5eef8"/><text x="135" y="96" fill="#213744">Conv 3→16 · 3×3</text><rect x="25" y="116" width="220" height="38" rx="5" fill="#e5eef8"/><text x="135" y="142" fill="#213744">ReLU</text><rect x="25" y="162" width="220" height="38" rx="5" fill="#e5eef8"/><text x="135" y="188" fill="#213744">MaxPool 2×2</text></g><text x="135" y="235" font-size="21" font-weight="750" fill="#2878c8">N × 16 × 16 × 16</text></g>
    <path d="M660 205H735" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(755 70)"><rect width="270" height="270" rx="12" fill="#fff" stroke="#008e9b" stroke-width="6"/><text x="135" y="42" font-size="17" font-weight="800" fill="#008e9b">BLOCK 2</text><g font-size="18" font-weight="700"><rect x="25" y="70" width="220" height="38" rx="5" fill="#e1f1f0"/><text x="135" y="96" fill="#213744">Conv 16→32 · 3×3</text><rect x="25" y="116" width="220" height="38" rx="5" fill="#e1f1f0"/><text x="135" y="142" fill="#213744">ReLU</text><rect x="25" y="162" width="220" height="38" rx="5" fill="#e1f1f0"/><text x="135" y="188" fill="#213744">MaxPool 2×2</text></g><text x="135" y="235" font-size="21" font-weight="750" fill="#008e9b">N × 32 × 8 × 8</text></g>
    <path d="M1045 205H1120" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(1140 95)"><rect width="165" height="220" rx="12" fill="#fff" stroke="#7655ad" stroke-width="6"/><text x="82" y="45" font-size="17" font-weight="800" fill="#7655ad">HEAD</text><text x="82" y="98" font-size="18" font-weight="700" fill="#213744">Flatten</text><text x="82" y="132" font-size="18" fill="#526573">2,048 values</text><text x="82" y="174" font-size="18" font-weight="700" fill="#213744">Linear → 10</text></g>
  </g>
</svg>
