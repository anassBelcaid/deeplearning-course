<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Receptive fields grow with depth</title><desc id="desc">Three stride-one three by three convolution layers combine progressively wider regions: three, five, then seven pixels across, supporting edges, motifs, and object parts.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#b8cbd3" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="470" rx="18" fill="#f4f0e8"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(70 70)"><rect width="260" height="300" rx="12" fill="#fff" stroke="#2878c8" stroke-width="6"/><rect x="74" y="45" width="110" height="110" fill="url(#g)" stroke="#2878c8" stroke-width="5"/><path d="M98 132L160 70" stroke="#2878c8" stroke-width="14" stroke-linecap="round"/><text x="130" y="210" font-size="30" font-weight="750" fill="#213744">3 × 3</text><text x="130" y="250" font-size="21" fill="#526573">short edge</text></g>
    <path d="M350 220H450" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(470 70)"><rect width="260" height="300" rx="12" fill="#fff" stroke="#008e9b" stroke-width="6"/><rect x="74" y="45" width="110" height="110" fill="url(#g)" stroke="#008e9b" stroke-width="5"/><path d="M92 128Q128 62 170 128" fill="none" stroke="#008e9b" stroke-width="14" stroke-linecap="round"/><text x="130" y="210" font-size="30" font-weight="750" fill="#213744">5 × 5</text><text x="130" y="250" font-size="21" fill="#526573">curve or corner</text></g>
    <path d="M750 220H850" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(870 70)"><rect width="260" height="300" rx="12" fill="#fff" stroke="#7655ad" stroke-width="6"/><path d="M62 112Q130 45 198 112Q130 178 62 112Z" fill="none" stroke="#7655ad" stroke-width="13"/><circle cx="130" cy="112" r="30" fill="#7655ad"/><text x="130" y="210" font-size="30" font-weight="750" fill="#213744">7 × 7</text><text x="130" y="250" font-size="21" fill="#526573">eye-like part</text></g>
    <text x="600" y="430" font-family="ui-monospace,monospace" font-size="24" fill="#213744">r: 1  →  3  →  5  →  7  for three 3×3, stride-1 convolutions</text>
  </g>
</svg>
