<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../../../../lectures/11-variational-autoencoders/"><title>VAE interpolation experiment</title><link rel="stylesheet" href="../../site_libs/revealjs/dist/reset.css"><link rel="stylesheet" href="../../site_libs/revealjs/dist/reveal.css"><link rel="stylesheet" href="../../site_libs/revealjs/dist/theme/quarto-f3e585dc122d45960ea2c31f625881dd.css"><link rel="stylesheet" href="../01-what-is-learning/slides.css"><link rel="stylesheet" href="week11.css"><style>
html,body { margin:0; height:auto; overflow:visible; background:#f5f1e8; }
.reveal { font-size:28px; height:auto; width:100%; }
.reveal section { display:block; position:relative; box-sizing:border-box; padding:20px; width:100%; height:auto; text-align:left; }
.reveal .fragment { opacity:1; visibility:visible; }
.reveal .vae-live { grid-template-columns:1fr 1fr; gap:25px; margin:0; }
.reveal .vae-live img { width:100%; height:auto; max-height:none; }
.reveal .vae-live-controls h3 { font-size:29px; }
.reveal .posterior-stage { grid-template-columns:1fr 1.2fr 1fr; gap:15px; }
.reveal .posterior-stage figure img { width:100%; height:auto; }
.reveal .posterior-toolbar { margin-top:0; }
.reveal .training-inspection-layout { display:block; margin:0 auto; max-width:500px; }
.reveal .loss-ablation-layout { grid-template-columns:1fr; margin:0; }
.reveal .loss-ablation-controls p { font-size:22px; }
.reveal .loss-ablation-figure>figure { width:100%; height:auto; }
.reveal .loss-ablation-figure img { height:auto; width:100%; }
.reveal .elbo-example { grid-template-columns:1fr; gap:20px; margin:0; }
.reveal .reparam-controls { flex-wrap:wrap; margin:10px 0; gap:18px; }
.reveal .reparam-controls label { width:40%; }
.reveal .reparam-graph { height:auto; }
.reveal .reparam-rule p { font-size:23px; }
.reveal .latent-path-layout { gap:15px; }
.reveal .latent-endpoints p { font-size:20px; }
.reveal .latent-endpoints img { width:45px; height:45px; }
.reveal .latent-map-key { font-size:17px; }
.reveal #latent-path-map { height:auto; }
.reveal #latent-path-output { width:220px; height:220px; }
.reveal .kl-explorer { grid-template-columns:1fr; }
.reveal #kl-curves { height:auto; }
.reveal .kl-costs { gap:12px; }
.reveal .kl-costs strong { font-size:29px; }
.reveal .kl-costs span { font-size:13px; }
@media(max-width:700px) {
 .reveal .posterior-stage,.reveal .latent-path-layout,.reveal .vae-live { grid-template-columns:1fr; }
 .reveal .posterior-stage figure img { width:200px; margin:auto; }
 .reveal .vae-live img { width:260px; margin:auto; }
 .reveal .posterior-stage figure { max-width:100%; }
 .reveal .posterior-stage figcaption { font-size:21px; }
 .reveal .kl-costs { display:flex; flex-wrap:wrap; justify-content:center; }
}
</style></head><body><div class="reveal"><section class="slide level2 vae-s6" id="demo-interpolation">

<div class="posterior-toolbar">
<label for="latent-path">Endpoints</label><select disabled="" id="latent-path"><option value="0">T-shirt → trouser</option><option value="1">T-shirt → ankle boot</option></select><span>Same decoder · no new noise</span>
</div>
<div class="latent-path-layout">
<div>
<svg aria-label="Actual two-dimensional posterior means for 1,024 validation images, with a straight interpolation path and moving code marker." id="latent-path-map" role="img" viewbox="0 0 580 445">
</svg>
<p class="latent-map-key">
Blue: T-shirt · green: trouser · pink: boot<br/>Gray: other classes · labels used only for display
</p>
</div>
<div class="latent-path-view">
<div class="latent-endpoints">
<figure>
<img alt="Original validation T-shirt at endpoint A" id="latent-input-a" src="assets/evidence/latent/input-0.png"/>
<figcaption>
Input A
</figcaption>
</figure>
<p>
z(t) = (1 − t) μ<sub>A</sub> + t μ<sub>B</sub>
</p>
<figure>
<img alt="Original validation trouser at endpoint B" id="latent-input-b" src="assets/evidence/latent/input-1.png"/>
<figcaption>
Input B
</figcaption>
</figure>
</div>
<img alt="Decoder mean at the T-shirt endpoint" id="latent-path-output" src="assets/evidence/latent/shirt-trouser-0.png"/><label for="latent-t">Position t =
<output id="latent-t-value">
0.00
</output>
</label><input disabled="" id="latent-t" max="20" min="0" step="1" type="range" value="0"/>
<p id="latent-z">
Loading recorded latent path…
</p>
</div>
</div>



</section></div><script>
(async () => {
 const ready = () => new Promise(resolve => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', resolve, {once:true}) : resolve());
 await ready();
 const path=document.getElementById('latent-path'), slider=document.getElementById('latent-t');
 if(!path || !slider) return;
 const status=document.getElementById('latent-z');
 try {
  const response=await fetch('assets/evidence/latent/manifest.json');
  if(!response.ok) throw Error('Missing latent manifest');
  const data=await response.json(), svg=document.getElementById('latent-path-map');
  const ns='http://www.w3.org/2000/svg';
  function node(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.appendChild(e);return e;}
  const px=z=>75+(z+4)*51, py=z=>395-(z+4)*43;
  node('rect',{x:75,y:51,width:408,height:344,fill:'#fffdf7',stroke:'#bdcbd4'});
  for(const t of [-4,-2,0,2,4]){
   node('line',{x1:px(t),x2:px(t),y1:51,y2:395,stroke:'#dbe1e4'});
   node('line',{x1:75,x2:483,y1:py(t),y2:py(t),stroke:'#dbe1e4'});
   node('text',{x:px(t),y:419,'text-anchor':'middle','font-size':19,fill:'#435769'},String(t));
   node('text',{x:60,y:py(t)+6,'text-anchor':'end','font-size':19,fill:'#435769'},String(t));
  }
  node('text',{x:510,y:419,'font-size':23,fill:'#17212b'},'z₁');
  node('text',{x:38,y:40,'font-size':23,fill:'#17212b'},'z₂');
  let outside=0;
  for(const p of data.points){if(p.mu.some(v=>Math.abs(v)>4)){outside++;continue;}node('circle',{cx:px(p.mu[0]),cy:py(p.mu[1]),r:2.5,fill:({0:'#2878c8',1:'#38865a',9:'#c94f78'})[p.label]||'#94a3ad',opacity:.5});}
  node('text',{x:280,y:28,'text-anchor':'middle','font-size':18,fill:'#435769'},`1,024 validation means · ${outside} outside view`);
  const line=node('line',{stroke:'#17212b','stroke-width':3,'stroke-dasharray':'7 5'});
  const a=node('text',{'font-size':23,'font-weight':700,fill:'#17212b'},'A'),b=node('text',{'font-size':23,'font-weight':700,fill:'#17212b'},'B');
  const dot=node('circle',{r:8,fill:'#ef5b45',stroke:'white','stroke-width':3});
  function update(){
   const p=data.paths[+path.value], i=+slider.value, z=p.codes[i], start=p.codes[0],end=p.codes[20];
   for(const [k,v] of Object.entries({x1:px(start[0]),y1:py(start[1]),x2:px(end[0]),y2:py(end[1])}))line.setAttribute(k,v);
   for(const [e,z0] of [[a,start],[b,end]]){e.setAttribute('x',px(z0[0])+12);e.setAttribute('y',py(z0[1])-10);}
   dot.setAttribute('cx',px(z[0]));dot.setAttribute('cy',py(z[1]));
   const image=document.getElementById('latent-path-output');image.src=`assets/evidence/latent/${p.key}-${i}.png`;image.alt=`Recorded decoder mean: ${p.label}, t=${(i/20).toFixed(2)}`;
   const input=document.getElementById('latent-input-b');input.src=`assets/evidence/latent/input-${p.b}.png`;input.alt=p.b===1?'Original validation trouser at endpoint B':'Original validation ankle boot at endpoint B';
   document.getElementById('latent-t-value').textContent=(i/20).toFixed(2);
   status.textContent=`z = (${z[0].toFixed(2)}, ${z[1].toFixed(2)})`;
  }
  path.addEventListener('change',update);slider.addEventListener('input',update);
  update();path.disabled=false;slider.disabled=false;
 } catch(error){status.textContent='Recorded path unavailable; reload the course preview.';console.error(error);}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-AMS_HTML-full"></script>
