<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Forward graph and reverse topological traversal</title>
  <desc id="desc">A forward path from x and w through multiplication and addition to loss, with a backward gradient path in reverse order.</desc>
  <defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2377c9"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ef5b3f"/></marker><style>.n{fill:#fff;stroke:#17212b;stroke-width:3}.e{stroke:#2377c9;stroke-width:3;fill:none;marker-end:url(#f)}.r{stroke:#ef5b3f;stroke-width:4;fill:none;stroke-dasharray:10 7;marker-end:url(#b)}.t{font:600 21px system-ui,sans-serif;fill:#17212b}.s{font:18px system-ui,sans-serif;fill:#536575}</style></defs>
  <text x="40" y="38" class="t">Forward: compute and remember</text><text x="535" y="278" class="t" fill="#ef5b3f">Backward: visit in reverse order</text>
  <circle cx="100" cy="130" r="38" class="n"/><text x="100" y="137" text-anchor="middle" class="t">x</text><circle cx="100" cy="220" r="38" class="n"/><text x="100" y="227" text-anchor="middle" class="t">w</text>
  <path d="M138 130 C190 130 190 158 235 165" class="e"/><path d="M138 220 C190 220 190 190 235 180" class="e"/><rect x="240" y="135" width="100" height="70" rx="16" class="n"/><text x="290" y="178" text-anchor="middle" class="t">×</text>
  <path d="M340 170 H440" class="e"/><rect x="445" y="135" width="100" height="70" rx="16" class="n"/><text x="495" y="178" text-anchor="middle" class="t">+</text><path d="M545 170 H645" class="e"/><rect x="650" y="135" width="130" height="70" rx="16" class="n"/><text x="715" y="178" text-anchor="middle" class="t">loss</text>
  <path d="M715 225 C650 270 560 270 495 220" class="r"/><path d="M470 220 C410 270 345 270 305 220" class="r"/><path d="M275 220 C230 270 165 270 130 235" class="r"/>
</svg>
