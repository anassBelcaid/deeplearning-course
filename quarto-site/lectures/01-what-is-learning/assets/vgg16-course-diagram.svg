<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470" role="img" aria-labelledby="title desc">
  <title id="title">VGG-16 architecture</title>
  <desc id="desc">An RGB image passes through five convolutional blocks of increasing channel depth, then dense layers and 1000 ImageNet class scores.</desc>
  <rect width="1320" height="470" rx="24" fill="#fffdf7"/>
  <style>
    .label{font:700 23px system-ui,sans-serif;fill:#17212b}.small{font:500 17px ui-monospace,monospace;fill:#657079}.white{fill:#fff}.arrow{stroke:#17212b;stroke-width:5;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#17212b"/></marker></defs>
  <rect x="45" y="82" width="150" height="260" rx="16" fill="#f0c6a8" stroke="#17212b" stroke-width="3"/>
  <circle cx="120" cy="182" r="52" fill="#657079"/><path d="M75 148L88 90L110 139M165 148L152 90L130 139" fill="#657079"/><circle cx="102" cy="177" r="7" fill="#d58b16"/><circle cx="138" cy="177" r="7" fill="#d58b16"/>
  <text x="120" y="374" text-anchor="middle" class="label">RGB image</text><text x="120" y="402" text-anchor="middle" class="small">224×224×3</text>
  <line x1="205" y1="214" x2="245" y2="214" class="arrow"/>
  <g transform="translate(265 0)"><rect y="112" width="125" height="205" rx="12" fill="#8db9eb"/><text x="62" y="205" text-anchor="middle" class="label">Block 1</text><text x="62" y="235" text-anchor="middle" class="small">2× conv</text><text x="62" y="265" text-anchor="middle" class="small">64 maps</text></g>
  <g transform="translate(410 0)"><rect y="132" width="125" height="165" rx="12" fill="#68a0dc"/><text x="62" y="205" text-anchor="middle" class="label">Block 2</text><text x="62" y="235" text-anchor="middle" class="small">2× conv</text><text x="62" y="265" text-anchor="middle" class="small">128</text></g>
  <g transform="translate(555 0)"><rect y="147" width="125" height="135" rx="12" fill="#3f84ce"/><text x="62" y="200" text-anchor="middle" class="label white">Block 3</text><text x="62" y="230" text-anchor="middle" class="small white">3× · 256</text></g>
  <g transform="translate(700 0)"><rect y="162" width="125" height="105" rx="12" fill="#2878c8"/><text x="62" y="207" text-anchor="middle" class="label white">Block 4</text><text x="62" y="238" text-anchor="middle" class="small white">3× · 512</text></g>
  <g transform="translate(845 0)"><rect y="172" width="125" height="85" rx="12" fill="#18578f"/><text x="62" y="207" text-anchor="middle" class="label white">Block 5</text><text x="62" y="236" text-anchor="middle" class="small white">3× · 512</text></g>
  <line x1="985" y1="214" x2="1025" y2="214" class="arrow"/>
  <rect x="1045" y="137" width="105" height="155" rx="12" fill="#ef5b45"/><text x="1097" y="205" text-anchor="middle" class="label white">Dense</text><text x="1097" y="235" text-anchor="middle" class="small white">4096</text>
  <line x1="1160" y1="214" x2="1195" y2="214" class="arrow"/>
  <rect x="1212" y="172" width="70" height="85" rx="12" fill="#17212b"/><text x="1247" y="207" text-anchor="middle" class="label white">1000</text><text x="1247" y="235" text-anchor="middle" class="small white">classes</text>
  <text x="620" y="370" text-anchor="middle" class="label">spatial detail shrinks → semantic features grow</text>
  <text x="620" y="409" text-anchor="middle" class="small">13 learned 3×3 convolutions + 3 learned classifiers = VGG-16</text>
</svg>
