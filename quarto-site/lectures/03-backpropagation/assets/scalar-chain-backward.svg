<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
<title id="title">Backward propagation through five scalar operations</title><desc id="desc">Coral arrows move backward from loss 36 through the five operations. Sensitivities accumulate as 1, 12, 12, 144, 144, and finally 288 at x.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8c0c5"/></marker><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef5b45"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f2a37" flood-opacity=".12"/></filter><style>.ef{fill:none;stroke:#b8c0c5;stroke-width:3;marker-end:url(#f)}.eb{fill:none;stroke:#ef5b45;stroke-width:5;marker-end:url(#b)}.v{fill:#eaf3fb;stroke:#2878c8;stroke-width:4}.o{fill:#fffdf7;stroke:#ef5b45;stroke-width:4;filter:url(#s)}.l{fill:#ef5b45;stroke:#bd3e2d;stroke-width:4;filter:url(#s)}.id{fill:#17212b;font:italic 700 25px Georgia,serif;text-anchor:middle}.sens{fill:#ef5b45;font:700 18px Arial,sans-serif;text-anchor:middle}.sym{fill:#17212b;font:700 31px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.mult{fill:#ef5b45;font:700 20px Arial,sans-serif;text-anchor:middle}.white{fill:#fff;font:italic 700 25px Georgia,serif;text-anchor:middle}.white2{fill:#fff;font:700 18px Arial,sans-serif;text-anchor:middle}.stage{fill:#ef5b45;font:700 17px "Courier New",monospace;letter-spacing:1px}</style></defs>
<text class="stage" x="42" y="30">BACKWARD · INCOMING SENSITIVITY × LOCAL DERIVATIVE</text>
<path class="ef" d="M155 140H250M360 140H455M565 140H660M770 140H865M975 140H1070M1125 195V300M1070 355H975M865 355H770M660 355H565M455 355H365"/>
<path class="eb" d="M250 165H155M455 165H360M660 165H565M865 165H770M1070 165H975M1150 300V195M975 380H1070M770 380H865M565 380H660M365 380H455"/>
<circle class="v" cx="100" cy="140" r="55"/><text class="id" x="100" y="126">x = 1</text><text class="sens" x="100" y="161">d𝓛/dx = 288</text>
<rect class="o" x="250" y="85" width="110" height="110" rx="20"/><text class="sym" x="305" y="128">(·)²</text><text class="mult" x="305" y="169">× 2</text>
<circle class="v" cx="510" cy="140" r="55"/><text class="id" x="510" y="126">a = 1</text><text class="sens" x="510" y="161">d𝓛/da = 144</text>
<rect class="o" x="660" y="85" width="110" height="110" rx="20"/><text class="sym" x="715" y="128">+1</text><text class="mult" x="715" y="169">× 1</text>
<circle class="v" cx="920" cy="140" r="55"/><text class="id" x="920" y="126">b = 2</text><text class="sens" x="920" y="161">d𝓛/db = 144</text>
<rect class="o" x="1070" y="85" width="110" height="110" rx="20"/><text class="sym" x="1125" y="128">(·)³</text><text class="mult" x="1125" y="169">× 12</text>
<circle class="v" cx="1125" cy="355" r="55"/><text class="id" x="1125" y="341">c = 8</text><text class="sens" x="1125" y="376">d𝓛/dc = 12</text>
<rect class="o" x="865" y="300" width="110" height="110" rx="20"/><text class="sym" x="920" y="343">−2</text><text class="mult" x="920" y="384">× 1</text>
<circle class="v" cx="715" cy="355" r="55"/><text class="id" x="715" y="341">d = 6</text><text class="sens" x="715" y="376">d𝓛/dd = 12</text>
<rect class="o" x="455" y="300" width="110" height="110" rx="20"/><text class="sym" x="510" y="343">(·)²</text><text class="mult" x="510" y="384">× 12</text>
<circle class="l" cx="310" cy="355" r="55"/><text class="white" x="310" y="341">𝓛 = 36</text><text class="white2" x="310" y="376">seed = 1</text>
</svg>
