<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc"><title id="title">Dense block as cumulative feature reuse</title><desc id="desc">Four narrow dense layers each receive every earlier feature map and append k new channels.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#526573"/></marker><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17212b" flood-opacity=".13"/></filter><style>.plate{fill:#f7fafc;stroke:#7b5aa6;stroke-width:2.5;stroke-dasharray:9 7;rx:18}.layer{stroke:#17212b;stroke-width:1.4;rx:8;filter:url(#s)}.l1{fill:#dff2e8}.l2{fill:#b9dcf7}.l3{fill:#fee7cb}.l4{fill:#d8c8ec}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.4;rx:7}.concat{fill:#17212b;rx:7}.flow{fill:none;stroke:#526573;stroke-width:2.1;marker-end:url(#a)}.reuse{fill:none;stroke:#ef5b45;stroke-width:2.3;marker-end:url(#a)}.label{fill:#17212b;font:600 15px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.white{fill:#fff}.minor{fill:#526573;font:600 13px Arial,sans-serif;text-anchor:middle}.title{fill:#63498b;font:700 14px Arial,sans-serif}</style></defs><rect class="plate" x="22" y="55" width="1136" height="420"/><text class="title" x="52" y="86">DENSE BLOCK · RESOLUTION FIXED</text><rect class="io" x="52" y="225" width="125" height="58"/><text class="label" x="114.5" y="254">x₀ · C₀</text><path class="flow" d="M182 254H232"/><rect class="layer l1" x="242" y="210" width="155" height="88"/><text class="label" x="319.5" y="239">H₁</text><text class="minor" x="319.5" y="272">adds k channels</text><path class="flow" d="M402 254H460"/><rect class="layer l2" x="470" y="210" width="155" height="88"/><text class="label" x="547.5" y="239">H₂</text><text class="minor" x="547.5" y="272">adds k channels</text><path class="flow" d="M630 254H688"/><rect class="layer l3" x="698" y="210" width="155" height="88"/><text class="label" x="775.5" y="239">H₃</text><text class="minor" x="775.5" y="272">adds k channels</text><path class="flow" d="M858 254H916"/><rect class="layer l4" x="926" y="210" width="155" height="88"/><text class="label" x="1003.5" y="239">H₄</text><text class="minor" x="1003.5" y="272">adds k channels</text><path class="reuse" d="M114 218V135H547V202"/><path class="reuse" d="M114 218V112H775V202"/><path class="reuse" d="M114 218V89H1003V202"/><path class="reuse" d="M320 204V158H775V202"/><path class="reuse" d="M320 204V135H1003V202"/><path class="reuse" d="M548 204V158H1003V202"/><rect class="concat" x="344" y="380" width="492" height="55"/><text class="label white" x="590" y="407.5">[x₀, x₁, x₂, x₃, x₄] · C₀ + 4k channels</text><path class="flow" d="M1004 303V350H590V374"/><text class="minor" x="590" y="460">Each layer reads the collective feature history; it never overwrites it.</text></svg>
