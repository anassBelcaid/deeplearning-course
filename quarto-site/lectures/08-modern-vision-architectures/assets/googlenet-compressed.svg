<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="570" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc"><title id="title">GoogLeNet assembled from compressed Inception blocks</title><desc id="desc">A stem feeds three groups containing two, five, and two compressed Inception symbols, separated by pooling. Global average pooling and a linear classifier form the head.</desc><defs><filter id="s"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#17212b" flood-opacity=".13"/></filter><style>.group{fill:#edf6ff;stroke:#2878c8;stroke-width:2;stroke-dasharray:8 6;rx:16}.inc{fill:#dff2e8;stroke:#25734d;stroke-width:1.4;rx:7;filter:url(#s)}.pool{fill:#f4b267;stroke:#17212b;stroke-width:1.3;rx:6}.stem{fill:#b9dcf7;stroke:#17212b;stroke-width:1.4;rx:7;filter:url(#s)}.head{fill:#d8c8ec;stroke:#17212b;stroke-width:1.4;rx:7}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.3;rx:6}.label{fill:#17212b;font:600 14px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.tag{fill:#1f5f96;font:700 12px Arial,sans-serif}.note{fill:#526573;font:600 12px Arial,sans-serif;text-anchor:middle}</style></defs>
<rect class="head" x="430" y="10" width="320" height="38"/><text class="label" x="590" y="29">GAP → Dropout → Linear(K)</text>
<rect class="group" x="315" y="65" width="550" height="88"/><text class="tag" x="338" y="89">BODY 5 · 2 BLOCKS</text><rect class="inc" x="390" y="104" width="180" height="32"/><text class="label" x="480" y="120">Inception</text><rect class="inc" x="610" y="104" width="180" height="32"/><text class="label" x="700" y="120">Inception</text>
<rect class="pool" x="455" y="168" width="270" height="34"/><text class="label" x="590" y="185">MaxPool · stride 2</text>
<rect class="group" x="210" y="217" width="760" height="100"/><text class="tag" x="233" y="241">BODY 4 · 5 BLOCKS</text><rect class="inc" x="245" y="260" width="125" height="34"/><text class="label" x="307.5" y="277">Inception</text><rect class="inc" x="386" y="260" width="125" height="34"/><text class="label" x="448.5" y="277">Inception</text><rect class="inc" x="527" y="260" width="125" height="34"/><text class="label" x="589.5" y="277">Inception</text><rect class="inc" x="668" y="260" width="125" height="34"/><text class="label" x="730.5" y="277">Inception</text><rect class="inc" x="809" y="260" width="125" height="34"/><text class="label" x="871.5" y="277">Inception</text>
<rect class="pool" x="455" y="332" width="270" height="34"/><text class="label" x="590" y="349">MaxPool · stride 2</text>
<rect class="group" x="315" y="381" width="550" height="88"/><text class="tag" x="338" y="405">BODY 3 · 2 BLOCKS</text><rect class="inc" x="390" y="420" width="180" height="32"/><text class="label" x="480" y="436">Inception</text><rect class="inc" x="610" y="420" width="180" height="32"/><text class="label" x="700" y="436">Inception</text>
<rect class="stem" x="345" y="484" width="490" height="38"/><text class="label" x="590" y="503">STEM · conv7 → pool → conv1 → conv3 → pool</text><rect class="io" x="430" y="537" width="320" height="28"/><text class="label" x="590" y="551">image · 224 × 224 × 3</text><text class="note" x="980" y="112">compressed symbol:</text><rect class="inc" x="990" y="126" width="145" height="32"/><text class="label" x="1062.5" y="142">Inception</text><text class="note" x="1062" y="177">four branches inside</text>
</svg>
