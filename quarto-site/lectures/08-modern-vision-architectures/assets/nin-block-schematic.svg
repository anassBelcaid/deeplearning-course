<svg xmlns="http://www.w3.org/2000/svg" width="620" height="610" viewBox="0 0 620 610" role="img" aria-labelledby="title desc">
  <title id="title">Network in Network block</title><desc id="desc">A labeled NiN block plate contains one spatial convolution followed by two one by one convolutions, with a ReLU after each convolution.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17212b" flood-opacity=".14"/></filter><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#526573"/></marker><style>.plate{fill:#edf6ff;stroke:#2878c8;stroke-width:2.5;stroke-dasharray:9 7;rx:18}.spatial{fill:#b9dcf7;stroke:#17212b;stroke-width:1.5;rx:7;filter:url(#s)}.mix{fill:#dff2e8;stroke:#25734d;stroke-width:1.5;rx:7;filter:url(#s)}.relu{fill:#fff;stroke:#7b8993;stroke-width:1.3;rx:7}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.5;rx:7}.label{fill:#17212b;font:600 16px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#526573;font:600 13px Arial,sans-serif;text-anchor:middle}.title{fill:#1f5f96;font:700 15px Arial,sans-serif}.flow{stroke:#526573;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect class="plate" x="55" y="35" width="510" height="520"/><text class="title" x="80" y="66">NiN BLOCK · MLPConv</text>
  <rect class="io" x="105" y="565" width="410" height="35"/><text class="label" x="310" y="582.5">input · H × W × Cᵢₙ</text><line class="flow" x1="310" y1="561" x2="310" y2="535"/>
  <rect class="spatial" x="95" y="485" width="430" height="48"/><text class="label" x="310" y="509">Conv k × k · Cₒᵤₜ</text><line class="flow" x1="310" y1="481" x2="310" y2="459"/>
  <rect class="relu" x="180" y="417" width="260" height="40"/><text class="label" x="310" y="437">ReLU</text><line class="flow" x1="310" y1="413" x2="310" y2="391"/>
  <rect class="mix" x="95" y="341" width="430" height="48"/><text class="label" x="310" y="365">1 × 1 Conv · Cₒᵤₜ</text><line class="flow" x1="310" y1="337" x2="310" y2="315"/>
  <rect class="relu" x="180" y="273" width="260" height="40"/><text class="label" x="310" y="293">ReLU</text><line class="flow" x1="310" y1="269" x2="310" y2="247"/>
  <rect class="mix" x="95" y="197" width="430" height="48"/><text class="label" x="310" y="221">1 × 1 Conv · Cₒᵤₜ</text><line class="flow" x1="310" y1="193" x2="310" y2="171"/>
  <rect class="relu" x="180" y="129" width="260" height="40"/><text class="label" x="310" y="149">ReLU</text>
  <text class="small" x="310" y="101">same H × W · richer channel-wise function</text>
</svg>
