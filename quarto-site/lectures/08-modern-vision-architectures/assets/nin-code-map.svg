<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600" role="img" aria-labelledby="title desc">
  <title id="title">NiN module construction trace</title><desc id="desc">A compact bottom-to-top trace shows three NiN feature blocks with pooling, dropout, a class-map NiN block, global average pooling, and logits.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#17212b" flood-opacity=".13"/></filter><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#526573"/></marker><style>.plate{fill:#edf6ff;stroke:#2878c8;stroke-width:2;stroke-dasharray:7 5;rx:12}.last{fill:#eef8f2;stroke:#25734d}.pool{fill:#f4b267;stroke:#17212b;stroke-width:1.2;rx:5}.gap{fill:#f4b267;stroke:#17212b;stroke-width:1.5;rx:6;filter:url(#s)}.drop{fill:#f5e8ef;stroke:#a14e79;stroke-width:1.2;rx:5}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.2;rx:5}.label{fill:#17212b;font:600 13px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.tag{fill:#1f5f96;font:700 11px Arial,sans-serif}.green{fill:#25734d}.flow{stroke:#526573;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect class="io" x="65" y="556" width="370" height="32"/><text class="label" x="250" y="572">image</text><line class="flow" x1="250" y1="552" x2="250" y2="531"/>
  <rect class="plate" x="45" y="465" width="410" height="65"/><text class="tag" x="65" y="487">NiN BLOCK · 96</text><text class="label" x="250" y="510">11×11 → 1×1 → 1×1</text><line class="flow" x1="250" y1="461" x2="250" y2="443"/>
  <rect class="pool" x="95" y="410" width="310" height="32"/><text class="label" x="250" y="426">MaxPool 3×3 · stride 2</text><line class="flow" x1="250" y1="406" x2="250" y2="388"/>
  <rect class="plate" x="65" y="322" width="370" height="65"/><text class="tag" x="85" y="344">NiN BLOCK · 256</text><text class="label" x="250" y="367">5×5 → 1×1 → 1×1</text><line class="flow" x1="250" y1="318" x2="250" y2="300"/>
  <rect class="pool" x="115" y="267" width="270" height="32"/><text class="label" x="250" y="283">MaxPool 3×3 · stride 2</text><line class="flow" x1="250" y1="263" x2="250" y2="245"/>
  <rect class="plate" x="85" y="179" width="330" height="65"/><text class="tag" x="105" y="201">NiN BLOCK · 384</text><text class="label" x="250" y="224">3×3 → 1×1 → 1×1</text><line class="flow" x1="250" y1="175" x2="250" y2="157"/>
  <rect class="drop" x="140" y="124" width="220" height="32"/><text class="label" x="250" y="140">Pool → Dropout 0.5</text><line class="flow" x1="250" y1="120" x2="250" y2="102"/>
  <rect class="plate last" x="105" y="37" width="290" height="64"/><text class="tag green" x="125" y="59">NiN BLOCK · K CLASSES</text><text class="label" x="250" y="81">3×3 → 1×1 → 1×1</text>
  <rect class="gap" x="155" y="3" width="190" height="28"/><text class="label" x="250" y="17">GAP → K logits</text>
</svg>
