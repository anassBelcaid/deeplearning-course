<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="500" viewBox="0 0 1220 500" role="img" aria-labelledby="title desc">
  <title id="title">Identity and projection residual shortcuts</title>
  <desc id="desc">The left residual block adds an unchanged input when shape is preserved. The right block applies a one by one convolution on the shortcut when spatial size or channel count changes.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#526573"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17212b" flood-opacity=".13"/></filter>
    <style>.plate{fill:#fff;stroke:#c8d6df;stroke-width:2;rx:18}.idplate{stroke:#25734d}.projplate{stroke:#2878c8}.conv{fill:#b9dcf7;stroke:#17212b;stroke-width:1.4;rx:7;filter:url(#s)}.shortcut{fill:#dff2e8;stroke:#25734d;stroke-width:1.5;rx:7}.projection{fill:#d8c8ec;stroke:#63498b;stroke-width:1.5;rx:7}.io{fill:#f7f4ec;stroke:#526573;stroke-width:1.3;rx:7}.sum{fill:#ef5b45;stroke:#17212b;stroke-width:1.5}.flow{fill:none;stroke:#526573;stroke-width:2.2;marker-end:url(#a)}.skip{fill:none;stroke:#ef5b45;stroke-width:3;marker-end:url(#a)}.title{font:700 16px Arial,sans-serif;text-anchor:middle}.label{fill:#17212b;font:600 15px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#526573;font:600 13px Arial,sans-serif;text-anchor:middle}</style>
  </defs>
  <rect class="plate idplate" x="20" y="20" width="570" height="455"/><text class="title" x="305" y="53" fill="#25734d">IDENTITY SHORTCUT · SAME SHAPE</text>
  <rect class="io" x="48" y="218" width="86" height="50"/><text class="label" x="91" y="243">x</text><path class="flow" d="M138 243H185"/><rect class="conv" x="195" y="203" width="155" height="80"/><text class="label" x="272.5" y="230">residual path</text><text class="note" x="272.5" y="260">stride 1 · C → C</text><path class="flow" d="M355 243H440"/><path class="skip" d="M91 213V115H465V202"/><rect class="shortcut" x="205" y="87" width="180" height="48"/><text class="label" x="295" y="111">identity · no weights</text><circle class="sum" cx="465" cy="243" r="30"/><text x="465" y="244" fill="#fff" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">+</text><path class="flow" d="M499 243H530"/><text class="note" x="305" y="357">H × W × C is unchanged</text><text class="title" x="305" y="407" fill="#25734d">y = F(x) + x</text>
  <rect class="plate projplate" x="630" y="20" width="570" height="455"/><text class="title" x="915" y="53" fill="#2878c8">PROJECTION SHORTCUT · SHAPE CHANGES</text>
  <rect class="io" x="658" y="218" width="86" height="50"/><text class="label" x="701" y="243">x</text><path class="flow" d="M748 243H795"/><rect class="conv" x="805" y="203" width="155" height="80"/><text class="label" x="882.5" y="230">residual path</text><text class="note" x="882.5" y="260">stride 2 · C → 2C</text><path class="flow" d="M965 243H1050"/><path class="skip" d="M701 213V115H1075V202"/><rect class="projection" x="805" y="87" width="220" height="48"/><text class="label" x="915" y="111">1 × 1 Conv · stride 2</text><circle class="sum" cx="1075" cy="243" r="30"/><text x="1075" y="244" fill="#fff" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">+</text><path class="flow" d="M1109 243H1140"/><text class="note" x="915" y="357">both paths become H/2 × W/2 × 2C</text><text class="title" x="915" y="407" fill="#2878c8">y = F(x) + Wₛx</text>
</svg>
