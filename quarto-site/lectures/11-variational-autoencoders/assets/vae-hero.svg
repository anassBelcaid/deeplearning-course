<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">From a latent distribution to a generated image</title>
  <desc id="desc">A sampled point in a smooth cloud flows through an expanding decoder toward a clothing silhouette. Conceptual illustration, not model output.</desc>
  <defs>
    <radialGradient id="cloud"><stop stop-color="#68d5d6" stop-opacity=".65"/><stop offset="1" stop-color="#68d5d6" stop-opacity="0"/></radialGradient>
    <linearGradient id="decoder" x2="1" y2="1"><stop stop-color="#2c819b"/><stop offset="1" stop-color="#8267bc"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#bfd4e4"/></marker>
    <path id="shirt" d="M-37-58-78-30-56 4-35-7-35 68H35V-7L56 4 78-30 37-58 18-49Q0-29-18-49Z"/>
  </defs>
  <rect width="960" height="560" fill="#071525"/>
  <g stroke="#244054" stroke-width="1" opacity=".5"><path d="M50 140H380M50 210H380M50 280H380M50 350H380M50 420H380M80 110V450M150 110V450M220 110V450M290 110V450M360 110V450"/></g>
  <ellipse cx="208" cy="280" rx="165" ry="183" fill="url(#cloud)"/>
  <g fill="none" stroke="#69d1d3" stroke-width="2"><ellipse cx="208" cy="280" rx="130" ry="148" opacity=".25"/><ellipse cx="208" cy="280" rx="92" ry="105" opacity=".5"/><ellipse cx="208" cy="280" rx="50" ry="58" opacity=".8"/></g>
  <g fill="#bcf1e8" opacity=".7"><circle cx="190" cy="250" r="4"/><circle cx="237" cy="289" r="4"/><circle cx="172" cy="309" r="4"/><circle cx="247" cy="225" r="4"/><circle cx="218" cy="341" r="4"/><circle cx="141" cy="268" r="4"/></g>
  <circle cx="259" cy="266" r="17" fill="#efaa67" opacity=".18"/><circle cx="259" cy="266" r="8" fill="#ffbd76"/>
  <path d="M284 266H418" stroke="#bfd4e4" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="url(#decoder)"><rect x="439" y="236" width="22" height="60" rx="8"/><rect x="479" y="204" width="25" height="124" rx="9"/><rect x="522" y="168" width="28" height="196" rx="10"/><rect x="568" y="129" width="31" height="274" rx="11"/></g>
  <path d="M620 266H687" stroke="#bfd4e4" stroke-width="3" marker-end="url(#arrow)"/>
  <use href="#shirt" transform="translate(815 155) scale(.6) rotate(12)" fill="#8478bb" opacity=".25"/>
  <use href="#shirt" transform="translate(815 397) scale(.6) rotate(-10)" fill="#65bfc1" opacity=".25"/>
  <rect x="711" y="183" width="192" height="180" rx="20" fill="#152a3f" stroke="#344e65"/>
  <use href="#shirt" transform="translate(807 270) scale(.85)" fill="#eeb77d"/>
  <path d="M792 226Q807 241 822 226" fill="none" stroke="#a8764f" stroke-width="3"/>
</svg>
