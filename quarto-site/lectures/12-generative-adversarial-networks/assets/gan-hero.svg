<title id="title">Generating images with feedback from a learned judge</title>
<desc id="desc">Noise enters expanding generator layers and becomes a garment. An observed garment and the generated garment feed the same shrinking discriminator layers. A dashed return path previews training feedback. Conceptual illustration, not measured outputs.</desc>
