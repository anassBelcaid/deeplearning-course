<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" role="img" aria-labelledby="t d"><title id="t">Different learned filters produce different feature maps</title><desc id="d">One input image is processed by three distinct filters sensitive to a vertical edge, diagonal edge, and small curve, producing three spatial response maps.</desc><defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#bdced5" stroke-width="2"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker></defs><rect width="1260" height="520" rx="18" fill="#f4f0e8"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g transform="translate(55 105)"><text x="180" y="-45" font-size="22" font-weight="750" fill="#213744">one input</text><rect width="360" height="300" fill="#fff" stroke="#526573" stroke-width="6"/><rect x="20" y="20" width="320" height="260" fill="url(#g)"/><path d="M75 238L155 96" stroke="#2878c8" stroke-width="20" stroke-linecap="round"/><path d="M230 65V238" stroke="#008e9b" stroke-width="20" stroke-linecap="round"/><path d="M178 215Q245 120 315 205" fill="none" stroke="#7655ad" stroke-width="18" stroke-linecap="round"/></g><path d="M440 255H540" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/><g transform="translate(575 45)"><text x="300" y="25" font-size="22" font-weight="750" fill="#213744">three learned visual questions</text>
<g transform="translate(0 60)"><rect width="175" height="175" rx="10" fill="#fff" stroke="#2878c8" stroke-width="5"/><path d="M35 140L140 35" stroke="#2878c8" stroke-width="16"/><text x="87" y="215" font-size="17" fill="#526573">diagonal?</text><rect x="0" y="245" width="175" height="175" rx="10" fill="#e5eef8" stroke="#2878c8" stroke-width="5"/><circle cx="55" cy="335" r="28" fill="#2878c8"/><text x="87" y="455" font-size="16" fill="#526573">response map 1</text></g>
<g transform="translate(215 60)"><rect width="175" height="175" rx="10" fill="#fff" stroke="#008e9b" stroke-width="5"/><path d="M87 28V148" stroke="#008e9b" stroke-width="16"/><text x="87" y="215" font-size="17" fill="#526573">vertical?</text><rect x="0" y="245" width="175" height="175" rx="10" fill="#e1f1f0" stroke="#008e9b" stroke-width="5"/><circle cx="118" cy="305" r="28" fill="#008e9b"/><text x="87" y="455" font-size="16" fill="#526573">response map 2</text></g>
