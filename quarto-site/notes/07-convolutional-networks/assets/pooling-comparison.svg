<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Max and average pooling preserve different summaries</title><desc id="d">The same two by two patch produces eight under max pooling and three point five under average pooling, while channels remain separate.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker></defs><rect width="1200" height="470" rx="18" fill="#f4f0e8"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g transform="translate(80 90)"><text x="150" y="-35" font-size="22" font-weight="750" fill="#213744">same feature-map patch</text><g font-family="ui-monospace,monospace" font-size="36" fill="#213744"><rect width="150" height="150" fill="#fff" stroke="#526573" stroke-width="5"/><rect x="150" width="150" height="150" fill="#fff" stroke="#526573" stroke-width="5"/><rect y="150" width="150" height="150" fill="#fff" stroke="#526573" stroke-width="5"/><rect x="150" y="150" width="150" height="150" fill="#ffd9d1" stroke="#ef6b52" stroke-width="7"/><text x="75" y="90">1</text><text x="225" y="90">2</text><text x="75" y="240">3</text><text x="225" y="240">8</text></g></g><path d="M420 180H570" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/><path d="M420 300H570" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/><g transform="translate(610 78)"><rect width="500" height="135" rx="12" fill="#fff" stroke="#ef6b52" stroke-width="6"/><text x="110" y="42" font-size="18" font-weight="800" fill="#c44732">MAX POOL</text><text x="300" y="88" font-size="48" font-weight="750" fill="#213744">8</text><text x="405" y="82" font-size="17" fill="#526573">strongest evidence</text></g><g transform="translate(610 255)"><rect width="500" height="135" rx="12" fill="#fff" stroke="#2878c8" stroke-width="6"/><text x="110" y="42" font-size="18" font-weight="800" fill="#2878c8">AVERAGE POOL</text><text x="300" y="88" font-size="48" font-weight="750" fill="#213744">3.5</text><text x="415" y="82" font-size="17" fill="#526573">mean activity</text></g></g></svg>
