<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">One detector reused across positions</title><desc id="d">Two image grids contain the same boat-like shape at different positions. A shared local detector identifies both, while flattening assigns them unrelated coordinates.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#adc3cc" stroke-width="2"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6b52"/></marker></defs>
<rect width="1200" height="520" rx="18" fill="#f4f0e8"/>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="300" y="48" font-size="24" font-weight="750" fill="#213744">same local pattern, new position</text><text x="920" y="48" font-size="24" font-weight="750" fill="#213744">one shared detector</text>
<g transform="translate(55 85)"><rect width="300" height="300" fill="#fff" stroke="#526573" stroke-width="5"/><rect x="15" y="15" width="270" height="270" fill="url(#g)"/><path d="M55 225H170L150 255H80Z" fill="#2878c8"/><path d="M108 145V225M108 145L160 210H108Z" fill="#e5eef8" stroke="#2878c8" stroke-width="8"/><rect x="35" y="125" width="160" height="160" fill="#ef6b52" fill-opacity=".1" stroke="#ef6b52" stroke-width="6"/></g>
<g transform="translate(385 85)"><rect width="300" height="300" fill="#fff" stroke="#526573" stroke-width="5"/><rect x="15" y="15" width="270" height="270" fill="url(#g)"/><path d="M130 225H245L225 255H155Z" fill="#2878c8"/><path d="M183 145V225M183 145L235 210H183Z" fill="#e5eef8" stroke="#2878c8" stroke-width="8"/><rect x="110" y="125" width="160" height="160" fill="#ef6b52" fill-opacity=".1" stroke="#ef6b52" stroke-width="6"/></g>
<path d="M720 235H810" stroke="#ef6b52" stroke-width="7" marker-end="url(#a)"/><g transform="translate(840 110)"><rect width="270" height="250" rx="14" fill="#fff" stroke="#008e9b" stroke-width="6"/><g transform="translate(60 45)" fill="#e5f4f3" stroke="#fff" stroke-width="4"><rect width="50" height="50"/><rect x="50" width="50" height="50"/><rect x="100" width="50" height="50"/><rect y="50" width="50" height="50"/><rect x="50" y="50" width="50" height="50" fill="#008e9b"/><rect x="100" y="50" width="50" height="50" fill="#008e9b"/><rect y="100" width="50" height="50"/><rect x="50" y="100" width="50" height="50" fill="#008e9b"/><rect x="100" y="100" width="50" height="50"/></g><text x="135" y="225" font-size="20" fill="#526573">same weights at both locations</text></g>
<text x="370" y="455" font-size="20" fill="#526573">Flattening changes the coordinate; convolution reuses the question.</text></g>
</svg>
