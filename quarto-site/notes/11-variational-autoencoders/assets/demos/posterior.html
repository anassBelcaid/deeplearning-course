<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../../../../lectures/11-variational-autoencoders/"><title>VAE posterior experiment</title><link rel="stylesheet" href="../../site_libs/revealjs/dist/reset.css"><link rel="stylesheet" href="../../site_libs/revealjs/dist/reveal.css"><link rel="stylesheet" href="../../site_libs/revealjs/dist/theme/quarto-f3e585dc122d45960ea2c31f625881dd.css"><link rel="stylesheet" href="../01-what-is-learning/slides.css"><link rel="stylesheet" href="week11.css"><style>
html,body { margin:0; height:auto; overflow:visible; background:#f5f1e8; }
.reveal { font-size:28px; height:auto; width:100%; }
.reveal section { display:block; position:relative; box-sizing:border-box; padding:20px; width:100%; height:auto; text-align:left; }
.reveal .fragment { opacity:1; visibility:visible; }
.reveal .vae-live { grid-template-columns:1fr 1fr; gap:25px; margin:0; }
.reveal .vae-live img { width:100%; height:auto; max-height:none; }
.reveal .vae-live-controls h3 { font-size:29px; }
.reveal .posterior-stage { grid-template-columns:1fr 1.2fr 1fr; gap:15px; }
.reveal .posterior-stage figure img { width:100%; height:auto; }
.reveal .posterior-toolbar { margin-top:0; }
.reveal .training-inspection-layout { display:block; margin:0 auto; max-width:500px; }
.reveal .loss-ablation-layout { grid-template-columns:1fr; margin:0; }
.reveal .loss-ablation-controls p { font-size:22px; }
.reveal .loss-ablation-figure>figure { width:100%; height:auto; }
.reveal .loss-ablation-figure img { height:auto; width:100%; }
.reveal .elbo-example { grid-template-columns:1fr; gap:20px; margin:0; }
.reveal .reparam-controls { flex-wrap:wrap; margin:10px 0; gap:18px; }
.reveal .reparam-controls label { width:40%; }
.reveal .reparam-graph { height:auto; }
.reveal .reparam-rule p { font-size:23px; }
.reveal .latent-path-layout { gap:15px; }
.reveal .latent-endpoints p { font-size:20px; }
.reveal .latent-endpoints img { width:45px; height:45px; }
.reveal .latent-map-key { font-size:17px; }
.reveal #latent-path-map { height:auto; }
.reveal #latent-path-output { width:220px; height:220px; }
.reveal .kl-explorer { grid-template-columns:1fr; }
.reveal #kl-curves { height:auto; }
.reveal .kl-costs { gap:12px; }
.reveal .kl-costs strong { font-size:29px; }
.reveal .kl-costs span { font-size:13px; }
@media(max-width:700px) {
 .reveal .posterior-stage,.reveal .latent-path-layout,.reveal .vae-live { grid-template-columns:1fr; }
 .reveal .posterior-stage figure img { width:200px; margin:auto; }
 .reveal .vae-live img { width:260px; margin:auto; }
 .reveal .posterior-stage figure { max-width:100%; }
 .reveal .posterior-stage figcaption { font-size:21px; }
 .reveal .kl-costs { display:flex; flex-wrap:wrap; justify-content:center; }
}
</style></head><body><div class="reveal"><section class="slide level2 vae-s2" id="demo-posterior">

<div class="posterior-lab" id="posterior-lab">
<div class="posterior-toolbar">
<label for="posterior-input">Observed image</label><select id="posterior-input"><option value="0">T-shirt / top</option><option value="1">Trouser</option><option value="2">Ankle boot</option></select><button id="posterior-next" type="button">Next posterior draw →</button><button id="posterior-mean" type="button">Decode μ instead</button><span aria-live="polite" id="posterior-count">Draw 1 / 8</span>
</div>
<div class="posterior-stage">
<figure>
<img alt="First T-shirt/top in the fixed validation split." id="posterior-original" src="assets/evidence/posterior/input-0.png"/>
<figcaption>
Observed image <b>x</b>
</figcaption>
</figure>
<div class="posterior-density">
<svg aria-label="Encoder Gaussian in actual latent coordinates; cross marks the mean and dot marks the current code." id="posterior-map" role="img" viewbox="0 0 400 330">
</svg>
<p id="posterior-parameters">
Loading recorded encoder outputs…
</p>
</div>
<figure>
<img alt="Actual decoder mean for the first posterior draw." id="posterior-output" src="assets/evidence/posterior/sample-0-0.png"/>
<figcaption id="posterior-code">
Decoded sample
</figcaption>
</figure>
</div>
<p class="posterior-fixed">
Fixed input → fixed μ and σ. The sampled z can change.
</p>
</div>



</section></div><script>
document.addEventListener('DOMContentLoaded', async () => {
  const panel = document.getElementById('vae-sampler');
  if (!panel) return;
  const code = document.getElementById('draw-code');
  const button = document.getElementById('next-draw');
  try {
    const response = await fetch('assets/evidence/manifest.json');
    if (!response.ok) throw new Error('Missing sample manifest');
    const data = await response.json();
    let index = 0;
    function show() {
      code.textContent = 'z = (' + data.prior_codes[index].map(v => v.toFixed(2)).join(', ') + ')';
      document.getElementById('draw-count').textContent = index + 1;
      const image = document.getElementById('draw-image');
      image.src = 'assets/evidence/draw-' + String(index).padStart(2, '0') + '.png';
      image.alt = 'Actual VAE decoder mean for recorded latent draw ' + (index + 1);
    }
    button.addEventListener('click', () => { index = (index + 1) % data.prior_codes.length; show(); });
    show();
  } catch (error) {
    code.textContent = 'Recorded draw 1; serve this deck over HTTP to enable cycling.';
    button.disabled = true;
  }
});
</script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const panel = document.getElementById('posterior-lab');
  if (!panel) return;
  const base = 'assets/evidence/posterior/';
  const select = document.getElementById('posterior-input');
  const next = document.getElementById('posterior-next');
  const meanButton = document.getElementById('posterior-mean');
  const status = document.getElementById('posterior-count');
  const parameters = document.getElementById('posterior-parameters');
  const map = document.getElementById('posterior-map');
  const fmt = values => '(' + values.map(v => v.toFixed(3)).join(', ') + ')';
  try {
    const response = await fetch(base + 'manifest.json');
    if (!response.ok) throw new Error('Missing posterior manifest');
    const data = await response.json();
    let input = 0, draw = 0, atMean = false;
    function show() {
      const r = data.records[input];
      const code = atMean ? r.mu : r.codes[draw];
      document.getElementById('posterior-original').src = base + `input-${input}.png`;
      document.getElementById('posterior-original').alt = `Observed ${r.label}, validation dataset index ${r.dataset_index}.`;
      const output = document.getElementById('posterior-output');
      output.src = base + (atMean ? `mean-${input}.png` : `sample-${input}-${draw}.png`);
      output.alt = `Actual decoder mean for ${r.label}, ${atMean ? 'posterior mean code' : 'posterior draw ' + (draw + 1)}.`;
      document.getElementById('posterior-code').textContent = (atMean ? 'μ = ' : 'z = ') + fmt(code);
      parameters.textContent = 'μ = ' + fmt(r.mu) + '\nσ = ' + fmt(r.sigma);
      status.textContent = atMean ? 'At μ · no draw' : `Draw ${draw + 1} / ${r.codes.length}`;
      meanButton.setAttribute('aria-pressed', String(atMean));
      // Same units and scale for each input; explicitly centered local window.
      const scale = 250 / .6;
      const sx = v => 205 + (v - r.mu[0]) * scale;
      const sy = v => 155 - (v - r.mu[1]) * scale;
      let svg = '<text x="205" y="17" text-anchor="middle" font-size="15" fill="#657079">LOCAL ZOOM · μ ± 0.30 on each axis</text>';
      svg += '<rect x="80" y="30" width="250" height="250" fill="#fffdf7" stroke="#c8d6df"/>';
      for (const radius of [2, 1]) svg += `<ellipse cx="205" cy="155" rx="${radius*r.sigma[0]*scale}" ry="${radius*r.sigma[1]*scale}" fill="#2878c8" fill-opacity=".10" stroke="#2878c8" stroke-opacity=".55"/>`;
      for (const delta of [-.3, 0, .3]) {
        svg += `<text x="${205+delta*scale}" y="300" text-anchor="middle" font-size="15">${(r.mu[0]+delta).toFixed(2)}</text>`;
        svg += `<text x="70" y="${160-delta*scale}" text-anchor="end" font-size="15">${(r.mu[1]+delta).toFixed(2)}</text>`;
      }
      svg += '<path d="M197 155 H213 M205 147 V163" stroke="#17212b" stroke-width="2.5"/>';
      svg += `<circle cx="${sx(code[0])}" cy="${sy(code[1])}" r="6" fill="#ef5b45" stroke="white" stroke-width="2"/>`;
      svg += '<text x="345" y="284" font-size="17">z₁</text><text x="55" y="25" font-size="17">z₂</text><text x="205" y="327" text-anchor="middle" font-size="15">+ mean μ · orange point: decoder input</text>';
      map.innerHTML = svg;
      map.setAttribute('aria-label', `Local Gaussian view for ${r.label}. Mean ${fmt(r.mu)}, standard deviation ${fmt(r.sigma)}. Current code ${fmt(code)}. Each axis spans mean minus 0.30 to mean plus 0.30.`);
    }
    next.addEventListener('click', () => { if (!atMean) draw = (draw + 1) % data.records[input].codes.length; atMean = false; show(); });
    meanButton.addEventListener('click', () => { atMean = true; show(); });
    select.addEventListener('change', () => { input = Number(select.value); draw = 0; atMean = false; show(); });
    show();
  } catch (error) {
    parameters.textContent = 'Recorded sample 1 shown. Serve the complete deck over HTTP to enable controls.';
    next.disabled = true; meanButton.disabled = true; select.disabled = true;
    status.textContent = 'Static preview';
  }
});
</script>
