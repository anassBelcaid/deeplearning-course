<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">How a Value remembers its children</title>
  <desc id="desc">Values a and b point into an addition operation that creates c. The c object stores a and b in its children set and plus in its operation field.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2377c9"/></marker>
    <style>
      .value{fill:#f8fbff;stroke:#2377c9;stroke-width:3}.op{fill:#fff4ec;stroke:#ef5b3f;stroke-width:3}
      .edge{fill:none;stroke:#2377c9;stroke-width:3;marker-end:url(#arrow)}
      .label{font:600 22px system-ui,sans-serif;fill:#17212b}.small{font:18px ui-monospace,monospace;fill:#384959}
    </style>
  </defs>
  <rect x="42" y="92" width="150" height="88" rx="18" class="value"/><text x="117" y="128" text-anchor="middle" class="label">a</text><text x="117" y="158" text-anchor="middle" class="small">data = 2</text>
  <rect x="42" y="242" width="150" height="88" rx="18" class="value"/><text x="117" y="278" text-anchor="middle" class="label">b</text><text x="117" y="308" text-anchor="middle" class="small">data = 3</text>
  <path d="M192 136 C270 136 280 184 345 196" class="edge"/><path d="M192 286 C270 286 280 238 345 226" class="edge"/>
  <circle cx="390" cy="211" r="45" class="op"/><text x="390" y="220" text-anchor="middle" class="label">+</text>
  <path d="M435 211 H530" class="edge"/>
  <rect x="535" y="55" width="380" height="310" rx="22" class="value"/>
  <text x="725" y="99" text-anchor="middle" class="label">c = Value(5)</text>
  <line x1="570" y1="120" x2="880" y2="120" stroke="#b8c4cf" stroke-width="2"/>
  <text x="580" y="162" class="small">data      5</text>
  <text x="580" y="207" class="small">grad      0</text>
  <text x="580" y="252" class="small">_op       '+'</text>
  <text x="580" y="297" class="small">_children {a, b}</text>
  <text x="580" y="338" class="small">_backward local rule</text>
</svg>
