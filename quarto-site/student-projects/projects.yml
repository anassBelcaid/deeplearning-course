- title: "Urban Change Detection using Deep Learning and Multitemporal Remote Sensing Images"
  students:
    - "Nouhaila Ghoulam"
    - "Meryem Nounah"
    - "Sara Hadi"
    - "Insaf Fergani"
  description: >-
    Rapid and sometimes unplanned urban expansion is hard to monitor by hand.
    Using the LEVIR-CD dataset of multitemporal aerial images, we build a
    pixel-difference baseline, a siamese CNN and a siamese U-Net in PyTorch to
    map building changes. We vary the loss function to cope with rare changed
    pixels, aiming to produce maps that could support sustainable urban
    planning.

  thumbnail: "images/urban-change-detection.png"
  thumbnail_alt: "Illustrative aerial views of the same neighborhood before and after construction, with new buildings outlined in amber."
  thumbnail_credit: "AI-generated course illustration · not dataset imagery or model results"
  status: "Proposal approved"

- title: "Echoes of Ancient Egypt: Can AI Learn to Read the Language of the Pharaohs?"
  students:
    - "El Bakkach Narjis"
    - "Beldriss Rim"
    - "Mahjoubi Douae"
    - "El jabri hafsa"
  description: >-
    This project aims to classify Egyptian hieroglyphs, contributing to
    historical research and helping people unfamiliar with this ancient writing
    system identify its symbols. We will compare an MLP baseline, a CNN, and
    pretrained VGG16 using transfer learning. Through this project, we also hope
    to gain a deeper understanding of how AI models learn, process images, and
    make predictions.
  thumbnail: "images/echoes-of-ancient-egypt.png"
  thumbnail_alt: "Gilded relief of two winged goddesses facing each other with outstretched wings, surrounded by vertical columns of Egyptian hieroglyphs on a golden wall."
  thumbnail_credit: "Source: National Geographic France · https://static.nationalgeographic.fr/files/styles/image_3200/public/egypt3.webp?w=1600&h=900"
  status: "Proposal approved"

- title: "OCT-Rescue: Supervised Classification and Anomaly Detection in OCT Images"
  students:
    - "EL ALAOUI SALEH Zouhair"
    - "BEN SALAH Aya"
    - "PROBI Nouhaila"
    - "HABIBI Rania"
  description: >-
    OCT-Rescue investigates the classification of four categories of retinal
    OCT images (CNV, DME, DRUSEN, and NORMAL) and unsupervised anomaly detection.
    We will compare baseline models, a CNN, a ResNet, and an autoencoder trained
    on normal images only. We will also examine data reliability and use Grad-CAM
    to interpret selected predictions. The project aims to understand the
    strengths and limitations of these approaches.
  thumbnail: "images/oct-rescue.png"
  thumbnail_alt: "Conceptual illustration of retinal OCT imaging analyzed by an artificial intelligence neural network, with four OCT scan examples."
  thumbnail_credit: "AI-generated illustration created with OpenAI ImageGen."
  status: "Proposal approved"

- title: 'Learning to Learn: A Dual-Network Approach to Multi-Class Active Learning'
  students:
  - LAMIA Sarkik
  - Zainab Oulad Dahman
  - Malak Khoumais
  description: This project will study how to reduce the human effort required to
    label images for multi-class classification. Using CIFAR-10, we plan to combine
    active learning, where a query network selects informative images for human
    annotation, with pseudo-labeling, where a second network helps identify reliable
    model-generated labels. We will evaluate whether combining both strategies improves
    classification performance while using fewer human labels.
  thumbnail: "images/learning-to-learn.jpeg"
  thumbnail_alt: "Illustration of image examples feeding a neural network, with a cycle of selecting uncertain images, human annotation, and model improvement."
  thumbnail_credit: "Thumbnail supplied by the project team"
  status: Proposal approved

- title: 'DeepSea Vision: Where Does Knowledge Help Most in Underwater Debris Segmentation?'
  students:
  - Khaoula Anjroum
  - Khadija Elouarad
  - Loubna Souali
  description: 'Marine debris is hard to spot in underwater images because of poor
    light, blur, and color loss. Using the TrashCan dataset, we will train U-Net
    models to find debris pixels, and test two sources of knowledge: ImageNet pretraining
    and augmentation based on how water absorbs light. We will check which helps
    more, and how well each model holds up as visibility drops, to inform underwater
    robot vision.'
  thumbnail: images/deepsea-vision.png
  thumbnail_alt: 'Side by side: an underwater robot image with debris, and the same
    image with the debris highlighted by a segmentation mask.'
  thumbnail_credit: AI-generated illustration, prompt by the team
  status: Proposal approved

- title: "Digital Twin of Electric Motors"
  students:
    - "BELHAJ Salma"
    - "BOUZHAR Salma"
    - "OUGRINE Rokaya"
    - "SIMBRE Achraf"
  description: >-
    This project explores Digital Twins through deep learning techniques.
    Using the PMSM and NASA IMS datasets, we will develop LSTM models to predict
    motor temperature and Autoencoders to detect early bearing degradation from
    vibration signals, improving motor monitoring and reliability.
  thumbnail: "images/digital-twin-electric-motors.png"
  thumbnail_alt: "Digital twin of an electric motor"
  thumbnail_credit: "https://sl.bing.net/fZHFIigGoEK"
  status: "Proposal approved"

- title: "Beyond Sentiment: Emotion Detection in Moroccan Darija"
  students:
    - "Soulaymane Boulaich"
    - "Fares Ilham"
    - "Tasnim Touil"
  description: >-
    Can a model go beyond positive and negative sentiment in Moroccan Darija?
    We plan to fine-tune a pretrained Darija language model to detect anger,
    fear, joy and sadness in short texts and compare it with a lightweight
    baseline. We will also test whether simple text normalization helps, and
    study which close emotions the model confuses most often.
  thumbnail: "images/emotions-darija.jpeg"
  thumbnail_alt: "Beyond Sentiment: emotion detection in Moroccan Darija, illustrated by four faces expressing anger, fear, joy, and sadness."
  thumbnail_credit: "Thumbnail supplied by the project team"
  status: "Proposal approved"

- title: "Plant Disease Detection Using Convolutional Neural Networks and Transfer Learning"
  students:
    - "Aouami Marouan"
    - "Aabaid Soulaimane"
    - "Baidane Ayoub"
    - "El Hajiri Jabriel"
  description: >-
    This project investigates automatic plant disease recognition from leaf images
    using deep learning. We will train a convolutional neural network and compare
    it with a pretrained ResNet18 model on the PlantVillage dataset. Through
    controlled experiments and error analysis, we aim to understand how transfer
    learning and data augmentation affect classification performance and robustness.
  thumbnail: "images/plant-disease-detection.png"
  thumbnail_alt: "A green leaf covered in water droplets rests on a mossy rock in sunlight."
  thumbnail_credit: "Thumbnail supplied by the project team"
  status: "Proposal approved"

- title: "The Invisible Defect: Beyond Reconstruction"

  students:
    - "Youssef Bouzine"
    - "Omar Jebbari"
    - "Rime Khazraoui"
    - "Houssam El Mezgueldi"

  description: >-
    Industrial defects can be rare, so collecting enough faulty examples
    for training is not always possible. We will compare CAE, VAE, and
    PatchCore using the MVTec AD dataset. We want to find out how well
    each method detects defective products, shows where the defects are,
    and how much time it needs to process an image.
  thumbnail: "images/the-invisible-defect.png"
  thumbnail_alt: "Illustration of industrial images passing through a deep learning model to produce defect heatmaps on a metal component and a cracked tile."
  thumbnail_credit: "Thumbnail supplied by the project team"
  status: "Proposal approved"

- title: "Image Manipulation Localization Using Deep Learning"
  students:
    - "Hicham Laiymani"
    - "Hajji Mohammed"
    - "Safa Moussamir"
  description: >-
    We will investigate pixel-level localization of manipulated regions in digital images,
    rather than only classifying images as authentic or fake. We plan to compare a U-Net
    baseline, a multi-scale CNN with an SRM noise branch, and, if resources allow, a
    pretrained Vision Transformer-based segmentation model. We will study cross-dataset
    generalization and robustness to compression, blur, and noise.
  thumbnail: "images/image-manipulation-localization.png"
  thumbnail_alt: "Side-by-side original and altered street images, with manipulated regions highlighted in magenta on the altered image."
  thumbnail_credit: "Original AI-generated illustration created for the team."
  status: "Proposal approved"

- title: "NetGuard AI: Network Intrusion and Anomaly Detection"
  students:
    - "Hazem Douzi"
    - "Al Baaza Adnan"
    - "Errahmouni Mohamed"
    - "El-Moujahid Ayoub"
  description: >-
    Network intrusions are difficult to detect reliably because normal traffic is
    diverse and labeled attacks may be imperfect. We will build NetGuard AI,
    comparing supervised XGBoost with two deep-learning approaches:
    a benign-only autoencoder and a generative adversarial network (GAN).
    We will evaluate detection quality, false alarms, and generalization,
    then demonstrate predictions in an interactive dashboard.
  thumbnail: "images/netguard-ai.png"
  thumbnail_alt: "NetGuard AI cybersecurity network monitoring and anomaly detection"
  thumbnail_credit: "Original illustration by the team using AI"
  status: "Proposal approved"
