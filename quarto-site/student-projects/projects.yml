- title: "Urban Change Detection using Deep Learning and Multitemporal Remote Sensing Images"
  students:
    - "Nouhaila Ghoulam"
    - "Meryem Nounah"
    - "Sara Hadi"
    - "Insaf Fergani"
  description: >-
    Rapid and sometimes unplanned urban expansion is hard to monitor by hand.
    Using the LEVIR-CD dataset of multitemporal aerial images, we build a
    pixel-difference baseline, a siamese CNN and a siamese U-Net in PyTorch to
    map building changes. We vary the loss function to cope with rare changed
    pixels, aiming to produce maps that could support sustainable urban
    planning.

  thumbnail: "images/urban-change-detection.png"
  thumbnail_alt: "Illustrative aerial views of the same neighborhood before and after construction, with new buildings outlined in amber."
  thumbnail_credit: "AI-generated course illustration · not dataset imagery or model results"
  status: "Proposal approved"

- title: "Echoes of Ancient Egypt: Can AI Learn to Read the Language of the Pharaohs?"
  students:
    - "El Bakkach Narjis"
    - "Beldriss Rim"
    - "Mahjoubi Douae"
    - "El jabri hafsa"
  description: >-
    This project aims to classify Egyptian hieroglyphs, contributing to
    historical research and helping people unfamiliar with this ancient writing
    system identify its symbols. We will compare an MLP baseline, a CNN, and
    pretrained VGG16 using transfer learning. Through this project, we also hope
    to gain a deeper understanding of how AI models learn, process images, and
    make predictions.
  thumbnail: "images/echoes-of-ancient-egypt.png"
  thumbnail_alt: "Gilded relief of two winged goddesses facing each other with outstretched wings, surrounded by vertical columns of Egyptian hieroglyphs on a golden wall."
  thumbnail_credit: "Source: National Geographic France · https://static.nationalgeographic.fr/files/styles/image_3200/public/egypt3.webp?w=1600&h=900"
  status: "Proposal approved"

- title: "OCT-Rescue: Supervised Classification and Anomaly Detection in OCT Images"
  students:
    - "EL ALAOUI SALEH Zouhair"
    - "BEN SALAH Aya"
    - "PROBI Nouhaila"
    - "HABIBI Rania"
  description: >-
    OCT-Rescue investigates the classification of four categories of retinal
    OCT images (CNV, DME, DRUSEN, and NORMAL) and unsupervised anomaly detection.
    We will compare baseline models, a CNN, a ResNet, and an autoencoder trained
    on normal images only. We will also examine data reliability and use Grad-CAM
    to interpret selected predictions. The project aims to understand the
    strengths and limitations of these approaches.
  thumbnail: "images/oct-rescue.png"
  thumbnail_alt: "Conceptual illustration of retinal OCT imaging analyzed by an artificial intelligence neural network, with four OCT scan examples."
  thumbnail_credit: "AI-generated illustration created with OpenAI ImageGen."
  status: "Proposal approved"

- title: 'Learning to Learn: A Dual-Network Approach to Multi-Class Active Learning'
  students:
  - LAMIA Sarkik
  - Zainab Oulad Dahman
  - Malak Khoumais
  description: This project will study how to reduce the human effort required to
    label images for multi-class classification. Using CIFAR-10, we plan to combine
    active learning, where a query network selects informative images for human
    annotation, with pseudo-labeling, where a second network helps identify reliable
    model-generated labels. We will evaluate whether combining both strategies improves
    classification performance while using fewer human labels.
  thumbnail: "images/learning-to-learn.jpeg"
  thumbnail_alt: "Illustration of image examples feeding a neural network, with a cycle of selecting uncertain images, human annotation, and model improvement."
  thumbnail_credit: "Thumbnail supplied by the project team"
  status: Proposal approved

- title: 'DeepSea Vision: Where Does Knowledge Help Most in Underwater Debris Segmentation?'
  students:
  - Khaoula Anjroum
  - Khadija Elouarad
  - Loubna Souali
  description: 'Marine debris is hard to spot in underwater images because of poor
    light, blur, and color loss. Using the TrashCan dataset, we will train U-Net
    models to find debris pixels, and test two sources of knowledge: ImageNet pretraining
    and augmentation based on how water absorbs light. We will check which helps
    more, and how well each model holds up as visibility drops, to inform underwater
    robot vision.'
  thumbnail: images/deepsea-vision.png
  thumbnail_alt: 'Side by side: an underwater robot image with debris, and the same
    image with the debris highlighted by a segmentation mask.'
  thumbnail_credit: AI-generated illustration, prompt by the team
  status: Proposal approved
