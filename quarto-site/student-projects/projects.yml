- title: "The Forgetful Explorer — Can an AI Escape a Maze It Cannot Fully See?"
  students:
    - "Ouazzaba El Mehdi"
    - "Ibnsalah Dirar"
    - "Ilyas Merouane"
    - "Louragli Mohamed Ali"
  description: >-
    Imagine escaping a maze while seeing only a few tiles around you. We will
    train reinforcement-learning agents in randomly generated mazes with a small
    field of view, comparing a forgetful agent that reacts only to what it sees
    now with agents that carry a memory. We hope to learn when memory helps most,
    and how it changes the way an agent explores.
